<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background-color: lightblue;
        }

        .calculator {
            width: 350px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #demo {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Simple Calculator</h1>

        <label>First Number:</label>
        <input type="text" id="first">

        <br>

        <label>Second Number:</label>
        <input type="text" id="second">

        <br><br>

        <button onclick="add()">Addition</button>
        <button onclick="subtract()">Subtraction</button>
        <button onclick="multiply()">Multiplication</button>
        <button onclick="divide()">Division</button>

        <p id="demo"></p>

    </div>

    <script>

        function add()
        {
            var a = parseInt(document.getElementById("first").value);
            var b = parseInt(document.getElementById("second").value);

            var c = a + b;

            document.getElementById("demo").innerHTML = "Addition = " + c;
        }

        function subtract()
        {
            var a = parseInt(document.getElementById("first").value);
            var b = parseInt(document.getElementById("second").value);

            var c = a - b;

            document.getElementById("demo").innerHTML = "Subtraction = " + c;
        }

        function multiply()
        {
            var a = parseInt(document.getElementById("first").value);
            var b = parseInt(document.getElementById("second").value);

            var c = a * b;

            document.getElementById("demo").innerHTML = "Multiplication = " + c;
        }

        function divide()
        {
            var a = parseInt(document.getElementById("first").value);
            var b = parseInt(document.getElementById("second").value);

            var c = a / b;

            document.getElementById("demo").innerHTML = "Division = " + c;
        }

    </script>

</body>
</html>
